<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1600px; height: 1200px; position: relative; overflow: hidden;
    background:
      /* Warm torch glow upper-right */
      radial-gradient(ellipse 50% 35% at 72% 12%, rgba(255,200,140,0.10) 0%, transparent 60%),
      /* Cool moon/sky glow center-top */
      radial-gradient(ellipse 70% 40% at 50% 10%, rgba(180,210,235,0.06) 0%, transparent 70%),
      /* Harbor mist at base */
      radial-gradient(ellipse 90% 30% at 50% 92%, rgba(125,180,200,0.10) 0%, transparent 70%),
      /* Vertical sky gradient: deep navy → near-black */
      linear-gradient(180deg, #060A14 0%, #08090E 30%, #0A0C12 60%, #0E1116 90%, #161A20 100%);
  }
  /* Star field */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 4%  3%, rgba(237,234,224,0.45) 50%, transparent 50%),
      radial-gradient(1px 1px at 9%  8%, rgba(237,234,224,0.3) 50%, transparent 50%),
      radial-gradient(2px 2px at 13% 5%, rgba(237,234,224,0.55) 50%, transparent 50%),
      radial-gradient(1px 1px at 18% 12%, rgba(237,234,224,0.3) 50%, transparent 50%),
      radial-gradient(1px 1px at 22% 4%, rgba(237,234,224,0.4) 50%, transparent 50%),
      radial-gradient(1px 1px at 27% 9%, rgba(237,234,224,0.3) 50%, transparent 50%),
      radial-gradient(1px 1px at 32% 14%, rgba(237,234,224,0.35) 50%, transparent 50%),
      radial-gradient(2px 2px at 38% 6%, rgba(237,234,224,0.55) 50%, transparent 50%),
      radial-gradient(1px 1px at 43% 11%, rgba(237,234,224,0.3) 50%, transparent 50%),
      radial-gradient(1px 1px at 47% 3%, rgba(237,234,224,0.4) 50%, transparent 50%),
      radial-gradient(1px 1px at 53% 8%, rgba(237,234,224,0.35) 50%, transparent 50%),
      radial-gradient(1px 1px at 59% 13%, rgba(237,234,224,0.3) 50%, transparent 50%),
      radial-gradient(2px 2px at 63% 5%, rgba(237,234,224,0.5) 50%, transparent 50%),
      radial-gradient(1px 1px at 68% 10%, rgba(237,234,224,0.3) 50%, transparent 50%),
      radial-gradient(1px 1px at 76% 4%, rgba(237,234,224,0.4) 50%, transparent 50%),
      radial-gradient(1px 1px at 81% 9%, rgba(237,234,224,0.3) 50%, transparent 50%),
      radial-gradient(1px 1px at 85% 14%, rgba(237,234,224,0.35) 50%, transparent 50%),
      radial-gradient(1px 1px at 91% 6%, rgba(237,234,224,0.5) 50%, transparent 50%),
      radial-gradient(1px 1px at 95% 11%, rgba(237,234,224,0.3) 50%, transparent 50%),
      radial-gradient(1px 1px at 7%  18%, rgba(237,234,224,0.25) 50%, transparent 50%),
      radial-gradient(1px 1px at 24% 22%, rgba(237,234,224,0.2) 50%, transparent 50%),
      radial-gradient(1px 1px at 56% 18%, rgba(237,234,224,0.25) 50%, transparent 50%),
      radial-gradient(1px 1px at 92% 22%, rgba(237,234,224,0.25) 50%, transparent 50%);
  }
  .stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }
  svg { width: 100%; height: 100%; display: block; }
  /* Distant city light suggestion on horizon */
  .horizon-lights {
    position: absolute; bottom: 12%; left: 5%; right: 5%;
    height: 4px;
    background:
      radial-gradient(1.5px 1.5px at 12% 50%, rgba(255,210,140,0.6) 50%, transparent 50%),
      radial-gradient(1px 1px at 22% 50%, rgba(255,210,140,0.5) 50%, transparent 50%),
      radial-gradient(2px 2px at 32% 50%, rgba(255,200,130,0.7) 50%, transparent 50%),
      radial-gradient(1px 1px at 42% 50%, rgba(255,220,160,0.5) 50%, transparent 50%),
      radial-gradient(1.5px 1.5px at 70% 50%, rgba(255,210,140,0.6) 50%, transparent 50%),
      radial-gradient(1px 1px at 78% 50%, rgba(255,200,130,0.5) 50%, transparent 50%),
      radial-gradient(2px 2px at 86% 50%, rgba(255,220,160,0.7) 50%, transparent 50%);
    z-index: 1;
  }
  /* Water reflection texture */
  .water {
    position: absolute; bottom: 0; left: 0; right: 0; height: 14%;
    background:
      linear-gradient(180deg, transparent 0%, rgba(80,130,160,0.10) 30%, rgba(50,90,120,0.20) 100%);
    z-index: 1;
  }
  .water::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(180deg, transparent 0px, transparent 4px, rgba(125,200,230,0.05) 4px, rgba(125,200,230,0.05) 5px);
  }
  /* Atmospheric haze at base */
  .haze {
    position: absolute; left: 0; right: 0;
    bottom: 8%; height: 32%;
    background: radial-gradient(ellipse 70% 100% at 50% 100%, rgba(125,180,220,0.08) 0%, transparent 70%);
    z-index: 2; pointer-events: none;
  }
  /* Film grain */
  .grain {
    position: absolute; inset: 0; pointer-events: none;
    opacity: 0.12; mix-blend-mode: overlay; z-index: 4;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.85  0 0 0 0 0.92  0 0 0 0 1  0 0 0 0.6 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  /* Subtle vignette */
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background: radial-gradient(ellipse 90% 90% at 50% 50%, transparent 40%, rgba(0,0,0,0.45) 100%);
  }
</style></head>
