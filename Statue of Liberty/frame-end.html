<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1600px; height: 1200px; position: relative;
    background:
      radial-gradient(ellipse 60% 40% at 70% 18%, rgba(255,200,150,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 80% 50% at 50% 85%, rgba(125,211,252,0.10) 0%, transparent 70%),
      linear-gradient(180deg, #050811 0%, #08090C 35%, #0B0E14 70%, #0E1219 100%);
    overflow: hidden;
  }
  /* Subtle star field in the upper sky */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 8%  6%, rgba(237,234,224,0.5) 50%, transparent 50%),
      radial-gradient(1px 1px at 17% 12%, rgba(237,234,224,0.3) 50%, transparent 50%),
      radial-gradient(1px 1px at 23% 5%, rgba(237,234,224,0.45) 50%, transparent 50%),
      radial-gradient(1px 1px at 34% 14%, rgba(237,234,224,0.3) 50%, transparent 50%),
      radial-gradient(2px 2px at 42% 7%, rgba(237,234,224,0.55) 50%, transparent 50%),
      radial-gradient(1px 1px at 58% 11%, rgba(237,234,224,0.3) 50%, transparent 50%),
      radial-gradient(1px 1px at 68% 4%, rgba(237,234,224,0.4) 50%, transparent 50%),
      radial-gradient(1px 1px at 78% 10%, rgba(237,234,224,0.35) 50%, transparent 50%),
      radial-gradient(1px 1px at 88% 6%, rgba(237,234,224,0.5) 50%, transparent 50%),
      radial-gradient(1px 1px at 94% 14%, rgba(237,234,224,0.3) 50%, transparent 50%),
      radial-gradient(1px 1px at 6% 22%, rgba(237,234,224,0.3) 50%, transparent 50%),
      radial-gradient(1px 1px at 95% 25%, rgba(237,234,224,0.3) 50%, transparent 50%);
  }
  /* Distant water horizon */
  body::after {
    content: ""; position: absolute;
    left: 0; right: 0; bottom: 0; height: 18%;
    background:
      linear-gradient(180deg, transparent 0%, rgba(125,211,252,0.04) 30%, rgba(125,211,252,0.12) 100%);
    pointer-events: none;
  }
  .stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  svg { width: 100%; height: 100%; display: block; }
  .grain {
    position: absolute; inset: 0; pointer-events: none;
    opacity: 0.12; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.85  0 0 0 0 0.92  0 0 0 0 1  0 0 0 0.6 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  /* Atmospheric haze near base */
  .haze {
    position: absolute; left: 0; right: 0;
    bottom: 6%; height: 30%;
    background: radial-gradient(ellipse 60% 100% at 50% 100%, rgba(125,211,252,0.06) 0%, transparent 60%);
    pointer-events: none;
  }
</style></head>
<body>
  <div class="stage">
    <svg viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Verdigris (oxidized copper) gradient — the famous patina color -->
        <linearGradient id="patina" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"  stop-color="#B8DAD0"/>
          <stop offset="25%" stop-color="#88B5A6"/>
          <stop offset="55%" stop-color="#5C8C7E"/>
          <stop offset="85%" stop-color="#3A6258"/>
          <stop offset="100%" stop-color="#234039"/>
        </linearGradient>
        <linearGradient id="patina-dark" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"  stop-color="#5C8C7E"/>
          <stop offset="100%" stop-color="#1A2C28"/>
        </linearGradient>
        <linearGradient id="rim-warm" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"  stop-color="rgba(255,200,150,0)"/>
          <stop offset="80%" stop-color="rgba(255,200,150,0.18)"/>
          <stop offset="100%" stop-color="rgba(255,210,160,0.45)"/>
        </linearGradient>
        <linearGradient id="rim-cool" x1="100%" y1="0%" x2="0%" y2="0%">
          <stop offset="0%"  stop-color="rgba(125,211,252,0)"/>
          <stop offset="80%" stop-color="rgba(125,211,252,0.10)"/>
          <stop offset="100%" stop-color="rgba(125,211,252,0.25)"/>
        </linearGradient>
        <linearGradient id="stone" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"  stop-color="#52483B"/>
          <stop offset="60%" stop-color="#332B22"/>
          <stop offset="100%" stop-color="#1A1410"/>
        </linearGradient>
        <radialGradient id="flame-outer" cx="50%" cy="65%" r="60%">
          <stop offset="0%"  stop-color="rgba(255,215,140,0.95)"/>
          <stop offset="50%" stop-color="rgba(255,160,60,0.55)"/>
          <stop offset="100%" stop-color="rgba(255,120,30,0)"/>
        </radialGradient>
        <radialGradient id="flame-core" cx="50%" cy="60%" r="40%">
          <stop offset="0%"  stop-color="#FFFCEC"/>
          <stop offset="60%" stop-color="rgba(255,232,140,0.9)"/>
          <stop offset="100%" stop-color="rgba(255,200,80,0)"/>
        </radialGradient>
        <radialGradient id="flame-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stop-color="rgba(255,180,90,0.35)"/>
          <stop offset="60%" stop-color="rgba(255,180,90,0.10)"/>
          <stop offset="100%" stop-color="rgba(255,180,90,0)"/>
        </radialGradient>
      </defs>

      <!-- FAR HORIZON LINE -->
      <rect x="0" y="908" width="800" height="2" fill="rgba(125,211,252,0.18)"/>

      <!-- TORCH FLAME GLOW (background halo so it shows behind everything) -->
      <ellipse cx="556" cy="98" rx="90" ry="100" fill="url(#flame-glow)"/>

      <!-- ============================================ -->
      <!-- PEDESTAL (dark stone) -->
      <!-- Fort Wood star base (front face) -->
      <path d="M 250 910 L 250 870 L 550 870 L 550 910 Z" fill="url(#stone)"/>
      <!-- Star point indications on left + right (suggest 11-point fortification) -->
      <polygon points="250,870 234,860 244,850 250,860" fill="url(#stone)"/>
      <polygon points="550,870 566,860 556,850 550,860" fill="url(#stone)"/>
      <polygon points="244,850 230,838 240,830 254,840" fill="url(#stone)"/>
      <polygon points="556,850 570,838 560,830 546,840" fill="url(#stone)"/>
      <!-- Lower tier -->
      <path d="M 285 870 L 285 830 L 515 830 L 515 870 Z" fill="url(#stone)"/>
      <!-- Main pedestal body -->
      <path d="M 310 830 L 310 740 L 490 740 L 490 830 Z" fill="url(#stone)"/>
      <!-- Pedestal cornice cap -->
      <path d="M 316 740 L 310 722 L 490 722 L 484 740 Z" fill="url(#stone)"/>

      <!-- Subtle texture lines on pedestal -->
      <g stroke="rgba(237,234,224,0.04)" stroke-width="0.5">
        <line x1="340" y1="830" x2="340" y2="740"/>
        <line x1="370" y1="830" x2="370" y2="740"/>
        <line x1="400" y1="830" x2="400" y2="740"/>
        <line x1="430" y1="830" x2="430" y2="740"/>
        <line x1="460" y1="830" x2="460" y2="740"/>
      </g>

      <!-- ============================================ -->
      <!-- ROBE — the flowing draped column from the pedestal top to the waist -->
      <path fill="url(#patina)" d="
        M 340 722
        Q 332 700 326 670
        Q 322 620 322 540
        L 322 460
        Q 326 410 350 370
        L 386 370
        L 386 305
        L 414 305
        L 414 370
        L 450 370
        Q 474 410 478 460
        L 478 540
        Q 478 620 474 670
        Q 468 700 460 722
        Z"/>

      <!-- Robe fold shadows (darker tones on the right side of folds) -->
      <g fill="rgba(35,64,57,0.4)">
        <path d="M 350 720 L 354 560 L 358 720 Z"/>
        <path d="M 372 720 L 376 540 L 380 720 Z"/>
        <path d="M 392 720 L 396 530 L 400 720 Z"/>
        <path d="M 412 720 L 416 530 L 420 720 Z"/>
        <path d="M 432 720 L 436 540 L 440 720 Z"/>
        <path d="M 452 720 L 456 560 L 460 720 Z"/>
      </g>

      <!-- Robe highlights (lighter on the left side of folds — light from upper-left) -->
      <g fill="rgba(184,218,208,0.18)">
        <path d="M 346 720 L 350 580 L 354 720 Z"/>
        <path d="M 366 720 L 370 560 L 374 720 Z"/>
        <path d="M 386 720 L 390 550 L 394 720 Z"/>
      </g>

      <!-- Belt/sash band -->
      <rect x="322" y="520" width="156" height="14" fill="url(#patina-dark)"/>
      <!-- Diagonal sash drape -->
      <path d="M 326 480 L 478 440 L 480 452 L 328 492 Z" fill="rgba(35,64,57,0.3)"/>

      <!-- ============================================ -->
      <!-- LEFT ARM HOLDING TABLET (positioned IN FRONT of robe) -->
      <!-- The arm extends from left shoulder across the body holding the tablet -->
      <path fill="url(#patina)" d="
        M 322 380
        L 305 370
        L 285 400
        L 268 460
        L 264 510
        L 280 545
        L 310 558
        L 326 552
        L 332 540
        L 330 520
        L 312 510
        L 296 495
        L 284 470
        L 294 430
        L 310 395
        Z"/>

      <!-- TABLET — held diagonally, leaning against torso -->
      <path d="M 226 432 L 308 416 L 326 528 L 244 544 Z" fill="url(#patina)" stroke="rgba(20,34,30,0.5)" stroke-width="1"/>
      <!-- Inscription lines -->
      <g stroke="rgba(20,34,30,0.4)" stroke-width="0.6" fill="none">
        <line x1="240" y1="448" x2="316" y2="436"/>
        <line x1="242" y1="464" x2="318" y2="452"/>
        <line x1="244" y1="480" x2="320" y2="468"/>
        <line x1="246" y1="496" x2="322" y2="484"/>
        <line x1="248" y1="512" x2="324" y2="500"/>
        <line x1="250" y1="528" x2="326" y2="516"/>
      </g>
      <!-- Tablet inscription text suggestion -->
      <text x="270" y="478" font-family="Times, serif" font-size="9" fill="rgba(20,34,30,0.55)" letter-spacing="1" text-anchor="middle">JULY · IV</text>
      <text x="276" y="498" font-family="Times, serif" font-size="9" fill="rgba(20,34,30,0.55)" letter-spacing="1" text-anchor="middle">MDCCLXXVI</text>

      <!-- ============================================ -->
      <!-- RIGHT ARM RAISED HOLDING TORCH (separate element, extends UP-RIGHT from shoulder) -->
      <path fill="url(#patina)" d="
        M 478 380
        L 492 380
        L 510 320
        L 524 250
        L 538 180
        L 548 140
        L 542 140
        L 532 178
        L 518 248
        L 504 318
        L 488 376
        Z"/>
      <!-- Hand gripping torch -->
      <path fill="url(#patina-dark)" d="M 540 138 L 552 130 L 564 134 L 562 150 L 548 156 Z"/>

      <!-- ============================================ -->
      <!-- TORCH (handle + bowl + flame) -->
      <!-- Handle -->
      <rect x="546" y="100" width="16" height="44" fill="url(#patina-dark)"/>
      <!-- Bowl/cup -->
      <path d="M 538 100 L 540 88 L 568 88 L 570 100 Z" fill="#D4B58C"/>
      <!-- Decorative rim -->
      <line x1="538" y1="94" x2="570" y2="94" stroke="rgba(0,0,0,0.3)" stroke-width="0.6"/>
      <!-- FLAME -->
      <path fill="url(#flame-outer)" d="
        M 544 88
        Q 540 70 546 56
        Q 552 44 556 52
        Q 560 38 564 48
        Q 568 34 568 50
        Q 576 46 572 64
        Q 580 60 574 76
        Q 582 74 576 88
        Q 568 96 558 96
        Q 548 96 544 88
        Z"/>
      <!-- Inner bright flame core -->
      <path fill="url(#flame-core)" d="
        M 552 84
        Q 550 70 555 60
        Q 560 50 562 60
        Q 566 56 564 76
        Q 562 84 555 86
        Z"/>

      <!-- ============================================ -->
      <!-- NECK -->
      <rect x="386" y="295" width="28" height="20" fill="url(#patina)"/>
      <!-- Neck shadow -->
      <rect x="386" y="305" width="28" height="2" fill="rgba(20,34,30,0.35)"/>

      <!-- ============================================ -->
      <!-- HEAD -->
      <!-- Face -->
      <ellipse cx="400" cy="248" rx="34" ry="46" fill="url(#patina)"/>
      <!-- Hair shadow line (under crown band) -->
      <path d="M 370 232 Q 400 218 430 232" stroke="rgba(20,34,30,0.4)" stroke-width="1" fill="none"/>
      <!-- Subtle facial shadows -->
      <ellipse cx="394" cy="252" rx="3" ry="2" fill="rgba(20,34,30,0.25)"/>
      <ellipse cx="410" cy="252" rx="3" ry="2" fill="rgba(20,34,30,0.25)"/>
      <path d="M 396 270 L 400 266 L 404 270" stroke="rgba(20,34,30,0.3)" stroke-width="0.8" fill="none"/>
      <path d="M 391 282 Q 400 287 409 282" stroke="rgba(20,34,30,0.4)" stroke-width="0.8" fill="none"/>

      <!-- ============================================ -->
      <!-- CROWN — diadem ring + 7 long pointed rays -->
      <!-- Crown band -->
      <path d="M 366 218 Q 400 210 434 218 L 432 208 Q 400 200 368 208 Z" fill="url(#patina)" stroke="rgba(20,34,30,0.4)" stroke-width="0.6"/>

      <!-- Seven crown rays — long, sharply pointed, fanning outward -->
      <g fill="url(#patina)" stroke="rgba(20,34,30,0.35)" stroke-width="0.5" stroke-linejoin="miter">
        <!-- Ray 1: center, straight up -->
        <polygon points="396,200 400,124 404,200"/>
        <!-- Ray 2: slight right -->
        <polygon points="408,201 426,126 414,202"/>
        <!-- Ray 3: more right -->
        <polygon points="418,206 452,138 425,208"/>
        <!-- Ray 4: far right, more horizontal -->
        <polygon points="428,214 482,170 436,217"/>
        <!-- Ray 5: slight left (mirror of 2) -->
        <polygon points="392,201 374,126 386,202"/>
        <!-- Ray 6: more left (mirror of 3) -->
        <polygon points="382,206 348,138 375,208"/>
        <!-- Ray 7: far left, more horizontal (mirror of 4) -->
        <polygon points="372,214 318,170 364,217"/>
      </g>
      <!-- Crown ring inner decorative line -->
      <path d="M 370 215 Q 400 207 430 215" stroke="rgba(20,34,30,0.3)" stroke-width="0.6" fill="none"/>

      <!-- ============================================ -->
      <!-- WARM RIM LIGHT on right side (light from torch direction) -->
      <path fill="url(#rim-warm)" opacity="0.65" d="
        M 478 380
        L 478 540
        L 478 720
        L 460 722
        L 468 710
        L 474 670
        L 478 620
        L 478 540
        L 478 460
        Z"/>

      <!-- Subtle cool rim light on left (from harbor) -->
      <path fill="url(#rim-cool)" opacity="0.4" d="
        M 322 460
        L 322 540
        L 322 620
        L 326 670
        L 332 710
        L 340 722
        L 322 720
        Z"/>

      <!-- Torch flame outer halo (foreground glow) -->
      <ellipse cx="556" cy="72" rx="50" ry="60" fill="url(#flame-outer)" opacity="0.45"/>
      <ellipse cx="556" cy="68" rx="22" ry="34" fill="url(#flame-core)" opacity="0.7"/>

      <!-- Re-render the very top of flame on top of all glow -->
      <path fill="url(#flame-core)" opacity="0.9" d="
        M 552 84
        Q 550 68 555 56
        Q 560 46 562 58
        Q 566 52 564 74
        Q 562 84 555 86
        Z"/>

    </svg>
  </div>

  <div class="haze"></div>
  <div class="grain"></div>
</body></html>
