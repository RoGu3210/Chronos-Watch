<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; padding: 0; background: #08090C; }
  body { width: 1600px; height: 1200px; position: relative; font-family: 'Courier New', monospace; }
  /* Engineering paper grid */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(125,211,252,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(125,211,252,0.05) 1px, transparent 1px);
    background-size: 40px 40px; opacity: 0.5;
  }
  body::after {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(125,211,252,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(125,211,252,0.08) 1px, transparent 1px);
    background-size: 200px 200px; opacity: 0.7;
  }
  .stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  svg { width: 100%; height: 100%; overflow: visible; }
  .blueprint path,
  .blueprint line,
  .blueprint rect,
  .blueprint ellipse,
  .blueprint polygon,
  .blueprint circle {
    stroke: #7DD3FC; stroke-width: 1.3; fill: none;
    stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 6px rgba(125,211,252,0.35));
  }
  .blueprint .heavy { stroke-width: 1.8; }
  .reg line { stroke: #1F2937; stroke-width: 0.6; stroke-dasharray: 3 6; }
  .dim line { stroke: #7DD3FC; stroke-width: 0.6; stroke-dasharray: 2 4; opacity: 0.7; }
  .dim text {
    font-family: 'Courier New', monospace; font-size: 12px;
    fill: #7DD3FC; letter-spacing: 2px;
  }
  .title {
    font-family: 'Courier New', monospace; font-size: 14px;
    fill: #7DD3FC; letter-spacing: 3px;
  }
  .corner {
    position: absolute; width: 24px; height: 24px;
    border: 1.5px solid #7DD3FC; opacity: 0.7;
  }
  .corner.tl { top: 36px; left: 36px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 36px; right: 36px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 36px; left: 36px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 36px; right: 36px; border-left: 0; border-top: 0; }
  .labels {
    position: absolute; top: 60px; left: 60px; right: 60px;
    display: flex; justify-content: space-between;
    color: #7DD3FC; font-family: 'Courier New', monospace;
    font-size: 11px; letter-spacing: 2px; opacity: 0.85;
  }
  .footlabels {
    position: absolute; bottom: 70px; left: 60px; right: 60px;
    display: flex; justify-content: space-between;
    color: #7DD3FC; font-family: 'Courier New', monospace;
    font-size: 11px; letter-spacing: 2px; opacity: 0.6;
  }
</style></head>
<body>
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>

  <div class="labels">
    <span>SIGHT №01 · LIBERTY ENLIGHTENING THE WORLD</span>
    <span>BARTHOLDI / EIFFEL · 1886</span>
  </div>

  <div class="stage">
    <svg viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet">
      <!-- registration crosses -->
      <g class="reg">
        <line x1="40"  y1="960" x2="760" y2="960"/>
        <line x1="400" y1="40"  x2="400" y2="960"/>
        <line x1="120" y1="40"  x2="120" y2="960"/>
        <line x1="680" y1="40"  x2="680" y2="960"/>
        <line x1="40"  y1="160" x2="760" y2="160"/>
        <line x1="40"  y1="540" x2="760" y2="540"/>
        <line x1="40"  y1="740" x2="760" y2="740"/>
      </g>

      <!-- Dimension lines + measurements -->
      <g class="dim">
        <line x1="60" y1="100" x2="60" y2="960"/>
        <line x1="56" y1="100" x2="68" y2="100"/>
        <line x1="56" y1="960" x2="68" y2="960"/>
        <text x="48" y="540" transform="rotate(-90 48 540)" text-anchor="middle">93 M · TOTAL HEIGHT</text>

        <line x1="740" y1="740" x2="740" y2="920"/>
        <line x1="734" y1="740" x2="746" y2="740"/>
        <line x1="734" y1="920" x2="746" y2="920"/>
        <text x="752" y="836" transform="rotate(-90 752 836)" text-anchor="middle">PEDESTAL · 47 M</text>

        <line x1="740" y1="100" x2="740" y2="740"/>
        <line x1="734" y1="100" x2="746" y2="100"/>
        <line x1="734" y1="740" x2="746" y2="740"/>
        <text x="752" y="424" transform="rotate(-90 752 424)" text-anchor="middle">FIGURE · 46 M</text>
      </g>

      <g class="blueprint">
        <!-- Ground / water line -->
        <line class="heavy" x1="40" y1="920" x2="760" y2="920"/>

        <!-- Fort Wood (11-point star) base — drawn as a simplified wider tier -->
        <path d="M 270 920 L 270 880 L 530 880 L 530 920 Z"/>
        <line x1="290" y1="920" x2="290" y2="880"/>
        <line x1="320" y1="920" x2="320" y2="880"/>
        <line x1="370" y1="920" x2="370" y2="880"/>
        <line x1="430" y1="920" x2="430" y2="880"/>
        <line x1="480" y1="920" x2="480" y2="880"/>
        <line x1="510" y1="920" x2="510" y2="880"/>
        <!-- Star points (11-point fort) — small triangular indications -->
        <path d="M 270 880 L 260 870 L 270 860"/>
        <path d="M 530 880 L 540 870 L 530 860"/>

        <!-- Lower tier -->
        <path d="M 300 880 L 300 840 L 500 840 L 500 880"/>

        <!-- Main pedestal with vertical ribs -->
        <path class="heavy" d="M 320 840 L 320 760 L 480 760 L 480 840"/>
        <line x1="350" y1="840" x2="350" y2="760"/>
        <line x1="380" y1="840" x2="380" y2="760"/>
        <line x1="410" y1="840" x2="410" y2="760"/>
        <line x1="440" y1="840" x2="440" y2="760"/>

        <!-- Pedestal cap / cornice -->
        <path d="M 326 760 L 320 740 L 480 740 L 474 760 Z"/>

        <!-- Plinth top (small platform) -->
        <line x1="340" y1="740" x2="460" y2="740"/>

        <!-- Robe / draped figure outline -->
        <path class="heavy" d="M 326 740 L 326 460 L 308 380"/>
        <path class="heavy" d="M 474 740 L 474 460 L 488 380"/>

        <!-- Draped feet / robe hem at base -->
        <path d="M 308 380 L 282 384 L 264 388 L 252 400 L 248 420 L 252 440 L 264 452 L 282 460 L 308 464 L 326 460"/>
        <path d="M 488 380 L 514 384 L 532 388 L 544 400 L 548 420 L 544 440 L 532 452 L 514 460 L 488 464 L 474 460"/>

        <!-- Interior fold lines on the robe -->
        <path d="M 350 740 L 360 600 L 366 480"/>
        <path d="M 380 740 L 386 600 L 392 460"/>
        <path d="M 420 740 L 414 600 L 408 460"/>
        <path d="M 450 740 L 442 600 L 434 480"/>
        <!-- Center sash -->
        <path d="M 400 740 L 400 460"/>

        <!-- Belt / waist -->
        <path d="M 326 460 L 320 420 L 326 380"/>
        <path d="M 474 460 L 480 420 L 474 380"/>
        <line x1="326" y1="420" x2="474" y2="420"/>

        <!-- Left arm holding tablet — extends down/forward -->
        <path d="M 326 420 L 296 470 L 282 540 L 288 580 L 312 600"/>
        <path d="M 312 600 L 320 600 L 320 580 L 308 570 L 296 560"/>
        <!-- Tablet -->
        <rect x="252" y="490" width="50" height="64"/>
        <line x1="262" y1="500" x2="294" y2="500"/>
        <line x1="262" y1="512" x2="294" y2="512"/>
        <line x1="262" y1="524" x2="294" y2="524"/>
        <line x1="262" y1="536" x2="294" y2="536"/>
        <line x1="262" y1="546" x2="294" y2="546"/>
        <!-- "JULY IV MDCCLXXVI" callout -->
        <text x="180" y="528" font-family="Courier New, monospace" font-size="10" fill="#7DD3FC" letter-spacing="1.5" text-anchor="end">JULY · IV · MDCCLXXVI</text>
        <line x1="186" y1="524" x2="252" y2="524" stroke="#7DD3FC" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.7"/>

        <!-- Right arm raised holding torch -->
        <path class="heavy" d="M 474 420 L 506 350 L 520 280 L 530 210 L 540 140"/>
        <path d="M 474 420 L 488 380"/>
        <!-- Inner arm contour -->
        <path d="M 490 420 L 514 350 L 528 280"/>
        <!-- Torch base -->
        <rect x="532" y="100" width="20" height="40"/>
        <line x1="536" y1="100" x2="536" y2="140"/>
        <line x1="544" y1="100" x2="544" y2="140"/>
        <!-- Torch flame -->
        <path d="M 542 100 Q 548 80 555 65 Q 562 50 568 65 Q 574 55 572 78 Q 580 72 574 92 Q 568 102 558 100 Q 548 104 542 100 Z"/>
        <line x1="554" y1="82" x2="558" y2="92"/>
        <line x1="566" y1="78" x2="564" y2="90"/>
        <!-- Torch label -->
        <text x="600" y="92" font-family="Courier New, monospace" font-size="10" fill="#7DD3FC" letter-spacing="1.5">FLAME · GILDED · MCMLXXXVI</text>
        <line x1="580" y1="88" x2="596" y2="88" stroke="#7DD3FC" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.7"/>

        <!-- Torso & neckline -->
        <path d="M 372 290 L 360 280 L 354 270"/>
        <path d="M 428 290 L 440 280 L 446 270"/>
        <!-- Neck -->
        <line x1="388" y1="260" x2="388" y2="226"/>
        <line x1="412" y1="260" x2="412" y2="226"/>
        <line x1="386" y1="240" x2="414" y2="240"/>

        <!-- Head -->
        <ellipse cx="400" cy="180" rx="32" ry="40"/>
        <!-- Face profile lines -->
        <line x1="400" y1="170" x2="396" y2="186"/>
        <line x1="384" y1="180" x2="416" y2="180"/>
        <path d="M 388 196 Q 400 202 412 196"/>
        <!-- Hair line -->
        <path d="M 372 168 Q 400 156 428 168"/>

        <!-- Crown — 7 rays representing the 7 seas/continents -->
        <line class="heavy" x1="400" y1="140" x2="400" y2="76"/>
        <path d="M 396 78 L 400 70 L 404 78 Z"/>
        <line x1="390" y1="142" x2="378" y2="92"/>
        <path d="M 376 94 L 378 86 L 382 92 Z"/>
        <line x1="410" y1="142" x2="422" y2="92"/>
        <path d="M 418 92 L 422 86 L 424 94 Z"/>
        <line x1="382" y1="146" x2="358" y2="104"/>
        <path d="M 356 106 L 358 98 L 362 102 Z"/>
        <line x1="418" y1="146" x2="442" y2="104"/>
        <path d="M 438 102 L 442 98 L 444 106 Z"/>
        <line x1="374" y1="154" x2="338" y2="124"/>
        <path d="M 336 126 L 338 118 L 342 120 Z"/>
        <line x1="426" y1="154" x2="462" y2="124"/>
        <line x1="458" y1="120" x2="462" y2="118"/>
        <path d="M 458 120 L 462 118 L 464 126 Z"/>
        <!-- Crown ring -->
        <path d="M 370 152 Q 400 158 430 152"/>
        <!-- Crown band detail -->
        <path d="M 370 158 Q 400 164 430 158"/>

        <!-- Crown rays label -->
        <text x="500" y="120" font-family="Courier New, monospace" font-size="10" fill="#7DD3FC" letter-spacing="1.5">CROWN · 7 RAYS</text>
        <line x1="464" y1="116" x2="496" y2="116" stroke="#7DD3FC" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.7"/>

        <!-- Foot label -->
        <text x="540" y="956" font-family="Courier New, monospace" font-size="10" fill="#7DD3FC" letter-spacing="1.5">FORT WOOD · 11-POINT STAR</text>
        <line x1="530" y1="952" x2="536" y2="952" stroke="#7DD3FC" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.7"/>
      </g>
    </svg>
  </div>

  <div class="footlabels">
    <span>SCALE 1:200 · METRIC</span>
    <span>SHEET A — ELEVATION</span>
    <span>DRG №01 / 01</span>
  </div>
</body></html>
