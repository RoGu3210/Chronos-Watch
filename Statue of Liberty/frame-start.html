<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; padding: 0; background: #050709; }
  body { width: 1600px; height: 1200px; position: relative; font-family: 'Courier New', monospace; overflow: hidden; }
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(125,211,252,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(125,211,252,0.06) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  body::after {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(125,211,252,0.13) 1px, transparent 1px),
      linear-gradient(90deg, rgba(125,211,252,0.13) 1px, transparent 1px);
    background-size: 160px 160px;
  }
  .stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }
  svg { width: 100%; height: 100%; overflow: visible; }
  /* Default stroke style for blueprint elements */
  .bp { stroke: #B8E0FA; stroke-width: 1; fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .bp-heavy { stroke-width: 1.8; }
  .bp-fine { stroke-width: 0.6; opacity: 0.85; }
  .bp-faint { stroke-width: 0.5; opacity: 0.55; }
  /* Hatching for shaded areas */
  .hatch { stroke: #7DD3FC; stroke-width: 0.45; opacity: 0.55; }
  /* Dimension annotations */
  .dim-line { stroke: #7DD3FC; stroke-width: 0.6; stroke-dasharray: 3 5; opacity: 0.75; }
  .dim-text {
    font-family: 'Courier New', monospace; font-size: 11px;
    fill: #7DD3FC; letter-spacing: 2px;
  }
  .leader { stroke: #7DD3FC; stroke-width: 0.5; opacity: 0.7; }
  .label {
    font-family: 'Courier New', monospace; font-size: 10px;
    fill: #B8E0FA; letter-spacing: 1.5px;
  }
  /* Glow on the line work */
  .blueprint-group { filter: drop-shadow(0 0 4px rgba(125,211,252,0.4)); }
  /* Corner brackets + decorative crosshairs */
  .corner {
    position: absolute; width: 32px; height: 32px;
    border: 1.5px solid #7DD3FC; opacity: 0.85; z-index: 3;
  }
  .corner.tl { top: 30px; left: 30px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 30px; right: 30px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 30px; left: 30px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 30px; right: 30px; border-left: 0; border-top: 0; }
  .crosshair {
    position: absolute; width: 16px; height: 16px;
    border: 1px solid #7DD3FC; border-radius: 50%; opacity: 0.7; z-index: 3;
  }
  .crosshair::before, .crosshair::after {
    content: ""; position: absolute; background: #7DD3FC;
  }
  .crosshair::before { left: -10px; right: -10px; top: 50%; height: 1px; transform: translateY(-50%); }
  .crosshair::after { top: -10px; bottom: -10px; left: 50%; width: 1px; transform: translateX(-50%); }
  .top-strip, .bot-strip {
    position: absolute; left: 80px; right: 80px;
    display: flex; justify-content: space-between; align-items: center;
    color: #7DD3FC; font-family: 'Courier New', monospace;
    font-size: 11px; letter-spacing: 2.5px; opacity: 0.85; z-index: 3;
  }
  .top-strip {
    top: 50px;
    border-bottom: 1px solid rgba(125,211,252,0.22);
    padding-bottom: 14px;
  }
  .bot-strip {
    bottom: 50px; opacity: 0.6;
    border-top: 1px solid rgba(125,211,252,0.22);
    padding-top: 12px;
  }
  .top-strip .tick {
    display: inline-block; width: 22px; height: 1px;
    background: #7DD3FC; margin-right: 12px; vertical-align: middle;
  }
</style></head>
