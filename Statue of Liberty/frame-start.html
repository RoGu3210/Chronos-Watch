<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; padding: 0; background: #08090C; }
  body { width: 1600px; height: 1200px; position: relative; font-family: 'Courier New', monospace; }
  /* Engineering paper grid — two layers, fine + coarse */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(125,211,252,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(125,211,252,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  body::after {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(125,211,252,0.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(125,211,252,0.10) 1px, transparent 1px);
    background-size: 200px 200px;
  }
  .stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  svg { width: 100%; height: 100%; overflow: visible; }
  .blueprint path,
  .blueprint line,
  .blueprint rect,
  .blueprint ellipse,
  .blueprint polygon,
  .blueprint circle,
  .blueprint polyline {
    stroke: #7DD3FC; stroke-width: 1.2; fill: none;
    stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 5px rgba(125,211,252,0.4));
  }
  .blueprint .heavy { stroke-width: 1.8; }
  .blueprint .fine { stroke-width: 0.8; opacity: 0.85; }
  .reg line { stroke: #1F2937; stroke-width: 0.6; stroke-dasharray: 3 6; }
  .dim line { stroke: #7DD3FC; stroke-width: 0.6; stroke-dasharray: 2 4; opacity: 0.65; }
  .dim text, .callout {
    font-family: 'Courier New', monospace; font-size: 11px;
    fill: #7DD3FC; letter-spacing: 1.8px;
  }
  .corner {
    position: absolute; width: 28px; height: 28px;
    border: 1.5px solid #7DD3FC; opacity: 0.8;
  }
  .corner.tl { top: 28px; left: 28px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 28px; right: 28px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 28px; left: 28px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 28px; right: 28px; border-left: 0; border-top: 0; }
  .top-strip {
    position: absolute; top: 48px; left: 56px; right: 56px;
    display: flex; justify-content: space-between; align-items: center;
    color: #7DD3FC; font-family: 'Courier New', monospace;
    font-size: 12px; letter-spacing: 2.5px; opacity: 0.9;
    border-bottom: 1px solid rgba(125,211,252,0.18);
    padding-bottom: 14px;
  }
  .top-strip .tick {
    display: inline-block; width: 20px; height: 1px;
    background: #7DD3FC; margin-right: 10px; vertical-align: middle;
  }
  .bot-strip {
    position: absolute; bottom: 56px; left: 56px; right: 56px;
    display: flex; justify-content: space-between; align-items: center;
    color: #7DD3FC; font-family: 'Courier New', monospace;
    font-size: 11px; letter-spacing: 2px; opacity: 0.55;
    border-top: 1px solid rgba(125,211,252,0.18);
    padding-top: 12px;
  }
  .crosshair {
    position: absolute; width: 14px; height: 14px;
    border: 1px solid #7DD3FC; border-radius: 50%; opacity: 0.7;
  }
  .crosshair::before, .crosshair::after {
    content: ""; position: absolute; background: #7DD3FC;
  }
  .crosshair::before { left: -8px; right: -8px; top: 50%; height: 1px; transform: translateY(-50%); }
  .crosshair::after { top: -8px; bottom: -8px; left: 50%; width: 1px; transform: translateX(-50%); }
</style></head>
<body>
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>

  <span class="crosshair" style="top: 110px;  left: 110px;"></span>
  <span class="crosshair" style="top: 110px;  right: 110px;"></span>
  <span class="crosshair" style="bottom: 110px; left: 110px;"></span>
  <span class="crosshair" style="bottom: 110px; right: 110px;"></span>

  <div class="top-strip">
    <span><span class="tick"></span>SIGHT №01 · LIBERTY ENLIGHTENING THE WORLD</span>
    <span>BARTHOLDI · 1886 · BEDLOE'S ISLAND</span>
    <span>DRG №01 / 01 · SHEET A</span>
  </div>

  <div class="stage">
    <svg viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet">
      <!-- registration grid -->
      <g class="reg">
        <line x1="40"  y1="930" x2="760" y2="930"/>
        <line x1="400" y1="40"  x2="400" y2="930"/>
        <line x1="120" y1="40"  x2="120" y2="930"/>
        <line x1="680" y1="40"  x2="680" y2="930"/>
        <line x1="40"  y1="120" x2="760" y2="120"/>
        <line x1="40"  y1="290" x2="760" y2="290"/>
        <line x1="40"  y1="540" x2="760" y2="540"/>
        <line x1="40"  y1="720" x2="760" y2="720"/>
      </g>

      <!-- DIMENSIONS -->
      <g class="dim">
        <!-- Total height: 93m -->
        <line x1="58" y1="80" x2="58" y2="930"/>
        <line x1="52" y1="80" x2="64" y2="80"/>
        <line x1="52" y1="930" x2="64" y2="930"/>
        <text x="42" y="510" transform="rotate(-90 42 510)" text-anchor="middle">93 M · TOTAL HEIGHT</text>

        <!-- Pedestal: 47m (right side) -->
        <line x1="742" y1="720" x2="742" y2="910"/>
        <line x1="736" y1="720" x2="748" y2="720"/>
        <line x1="736" y1="910" x2="748" y2="910"/>
        <text x="758" y="820" transform="rotate(-90 758 820)" text-anchor="middle">PEDESTAL · 47 M</text>

        <!-- Figure: 46m (right side, upper) -->
        <line x1="742" y1="120" x2="742" y2="720"/>
        <line x1="736" y1="120" x2="748" y2="120"/>
        <line x1="736" y1="720" x2="748" y2="720"/>
        <text x="758" y="420" transform="rotate(-90 758 420)" text-anchor="middle">STATUE · 46 M</text>
      </g>

      <g class="blueprint">

        <!-- ============================================ -->
        <!-- WATER LINE -->
        <line class="heavy" x1="40" y1="910" x2="760" y2="910"/>
        <!-- Subtle harbor ripple marks -->
        <line class="fine" x1="60" y1="918" x2="120" y2="918"/>
        <line class="fine" x1="160" y1="918" x2="220" y2="918"/>
        <line class="fine" x1="260" y1="918" x2="300" y2="918"/>
        <line class="fine" x1="500" y1="918" x2="540" y2="918"/>
        <line class="fine" x1="580" y1="918" x2="640" y2="918"/>
        <line class="fine" x1="680" y1="918" x2="740" y2="918"/>

        <!-- ============================================ -->
        <!-- FORT WOOD — 11-point star base (simplified to wide tier with star indications) -->
        <path class="heavy" d="M 250 910 L 250 870 L 550 870 L 550 910 Z"/>
        <!-- Star point indications on the left/right (suggesting 11-point fortification) -->
        <polyline points="250,870 234,860 244,850 250,860"/>
        <polyline points="550,870 566,860 556,850 550,860"/>
        <polyline points="244,850 230,838 240,830 254,840"/>
        <polyline points="556,850 570,838 560,830 546,840"/>
        <!-- Vertical bastion ribs -->
        <line class="fine" x1="290" y1="910" x2="290" y2="870"/>
        <line class="fine" x1="330" y1="910" x2="330" y2="870"/>
        <line class="fine" x1="370" y1="910" x2="370" y2="870"/>
        <line x1="400" y1="910" x2="400" y2="870"/>
        <line class="fine" x1="430" y1="910" x2="430" y2="870"/>
        <line class="fine" x1="470" y1="910" x2="470" y2="870"/>
        <line class="fine" x1="510" y1="910" x2="510" y2="870"/>

        <!-- ============================================ -->
        <!-- PEDESTAL TIERS -->
        <!-- Lower tier (transition) -->
        <path d="M 285 870 L 285 830 L 515 830 L 515 870"/>
        <line class="fine" x1="290" y1="830" x2="515" y2="830"/>
        <!-- Main pedestal body -->
        <path class="heavy" d="M 310 830 L 310 740 L 490 740 L 490 830"/>
        <!-- Vertical pilaster ribs -->
        <line x1="340" y1="830" x2="340" y2="740"/>
        <line x1="370" y1="830" x2="370" y2="740"/>
        <line x1="400" y1="830" x2="400" y2="740"/>
        <line x1="430" y1="830" x2="430" y2="740"/>
        <line x1="460" y1="830" x2="460" y2="740"/>
        <!-- Pedestal cap / cornice band -->
        <path d="M 316 740 L 310 722 L 490 722 L 484 740 Z"/>
        <!-- Plinth platform -->
        <line x1="335" y1="722" x2="465" y2="722"/>
        <line class="fine" x1="335" y1="715" x2="465" y2="715"/>

        <!-- ============================================ -->
        <!-- ROBE (the column-like draped figure) -->
        <!-- Robe hem at base — flares slightly outward -->
        <path class="heavy" d="M 340 722 L 332 710 L 326 670 L 322 620 L 322 540"/>
        <path class="heavy" d="M 460 722 L 468 710 L 474 670 L 478 620 L 478 540"/>
        <!-- Robe interior vertical fold lines (long flowing drapes) -->
        <line class="fine" x1="350" y1="722" x2="354" y2="560"/>
        <line class="fine" x1="370" y1="722" x2="372" y2="540"/>
        <line class="fine" x1="390" y1="722" x2="392" y2="540"/>
        <line class="fine" x1="400" y1="722" x2="400" y2="540"/>
        <line class="fine" x1="410" y1="722" x2="408" y2="540"/>
        <line class="fine" x1="430" y1="722" x2="428" y2="540"/>
        <line class="fine" x1="450" y1="722" x2="446" y2="560"/>

        <!-- ============================================ -->
        <!-- WAIST / BELT BAND -->
        <path d="M 322 540 L 322 520 L 478 520 L 478 540"/>
        <line class="fine" x1="322" y1="530" x2="478" y2="530"/>

        <!-- ============================================ -->
        <!-- TORSO / UPPER BODY -->
        <path class="heavy" d="M 322 520 L 322 460 L 332 410 L 350 370"/>
        <path class="heavy" d="M 478 520 L 478 460 L 468 410 L 450 370"/>
        <!-- Chest fold lines -->
        <line class="fine" x1="360" y1="520" x2="362" y2="400"/>
        <line class="fine" x1="380" y1="520" x2="380" y2="390"/>
        <line class="fine" x1="400" y1="520" x2="400" y2="380"/>
        <line class="fine" x1="420" y1="520" x2="420" y2="390"/>
        <line class="fine" x1="440" y1="520" x2="438" y2="400"/>
        <!-- Sash diagonal -->
        <line x1="340" y1="450" x2="460" y2="430"/>

        <!-- ============================================ -->
        <!-- SHOULDERS (raised level, broader than torso) -->
        <path d="M 350 370 L 332 360 L 320 358 L 312 365"/>
        <path d="M 450 370 L 468 360 L 480 358 L 488 365"/>

        <!-- ============================================ -->
        <!-- LEFT ARM HOLDING TABLET (descends across body) -->
        <!-- Upper arm: from left shoulder down/forward -->
        <path class="heavy" d="M 320 360 L 290 410 L 268 470"/>
        <!-- Forearm cradling tablet -->
        <path class="heavy" d="M 268 470 L 270 510 L 290 540 L 320 552"/>
        <!-- Hand on tablet -->
        <path d="M 320 552 L 332 550 L 340 542"/>
        <!-- Inner arm contour -->
        <path class="fine" d="M 332 365 L 305 415 L 282 472"/>
        <!-- Tablet — held diagonally, leaning against torso -->
        <path class="heavy" d="M 232 432 L 308 416 L 326 528 L 250 544 Z"/>
        <!-- Tablet inscription lines -->
        <line class="fine" x1="244" y1="448" x2="316" y2="436"/>
        <line class="fine" x1="246" y1="464" x2="318" y2="452"/>
        <line class="fine" x1="248" y1="480" x2="320" y2="468"/>
        <line class="fine" x1="250" y1="496" x2="322" y2="484"/>
        <line class="fine" x1="252" y1="512" x2="324" y2="500"/>
        <line class="fine" x1="254" y1="528" x2="326" y2="516"/>

        <!-- ============================================ -->
        <!-- RIGHT ARM RAISED HOLDING TORCH (THE iconic gesture) -->
        <!-- Upper arm: from right shoulder UP and slightly out -->
        <path class="heavy" d="M 480 360 L 506 290 L 524 230 L 538 170"/>
        <!-- Inner arm contour -->
        <path class="fine" d="M 468 366 L 492 296 L 512 234 L 528 174"/>
        <!-- Outer arm contour -->
        <path class="fine" d="M 492 358 L 520 294 L 538 232 L 552 170"/>
        <!-- Hand gripping torch handle -->
        <path d="M 538 170 L 548 160 L 558 158 L 562 162"/>
        <path d="M 528 174 L 540 162"/>

        <!-- ============================================ -->
        <!-- TORCH -->
        <!-- Torch handle (cylindrical) -->
        <path class="heavy" d="M 546 162 L 550 130 L 558 130 L 562 162 Z"/>
        <line class="fine" x1="554" y1="130" x2="554" y2="162"/>
        <!-- Torch bowl / cup -->
        <path class="heavy" d="M 542 130 L 544 116 L 564 116 L 566 130 Z"/>
        <!-- Decorative rim -->
        <line x1="542" y1="124" x2="566" y2="124"/>
        <!-- FLAME -->
        <path class="heavy" d="
          M 548 116
          Q 544 100 548 88
          Q 552 78 556 84
          Q 560 72 564 80
          Q 568 70 568 80
          Q 574 78 570 92
          Q 578 90 572 102
          Q 580 100 574 110
          Q 568 116 560 116
          Z"/>
        <!-- Inner flame -->
        <path class="fine" d="M 554 110 Q 556 96 560 88 Q 564 80 564 100 Z"/>

        <!-- ============================================ -->
        <!-- NECK -->
        <line x1="386" y1="370" x2="386" y2="305"/>
        <line x1="414" y1="370" x2="414" y2="305"/>
        <!-- Neck shadow line -->
        <line class="fine" x1="388" y1="345" x2="412" y2="345"/>

        <!-- ============================================ -->
        <!-- HEAD -->
        <!-- Face outline -->
        <ellipse cx="400" cy="248" rx="34" ry="46"/>
        <!-- Hair / forehead line -->
        <path d="M 370 232 Q 400 218 430 232"/>
        <!-- Eyes (suggested) -->
        <line class="fine" x1="386" y1="250" x2="394" y2="250"/>
        <line class="fine" x1="406" y1="250" x2="414" y2="250"/>
        <!-- Nose -->
        <line class="fine" x1="400" y1="252" x2="397" y2="270"/>
        <!-- Mouth -->
        <path class="fine" d="M 390 280 Q 400 285 410 280"/>
        <!-- Chin shadow -->
        <line class="fine" x1="390" y1="288" x2="410" y2="288"/>

        <!-- ============================================ -->
        <!-- CROWN — diadem ring + 7 long pointed rays -->
        <!-- Crown band/ring (sits on top of head) -->
        <path class="heavy" d="M 366 218 Q 400 210 434 218 L 432 208 Q 400 200 368 208 Z"/>
        <!-- Decorative band lines -->
        <line class="fine" x1="372" y1="212" x2="428" y2="212"/>

        <!-- Seven crown rays (longer, more dramatic) — central + 3 each side -->
        <!-- Ray 1 (center, straight up) -->
        <path class="heavy" d="M 400 200 L 400 130 L 396 138 M 400 130 L 404 138"/>
        <line class="fine" x1="400" y1="170" x2="394" y2="178"/>
        <line class="fine" x1="400" y1="170" x2="406" y2="178"/>

        <!-- Ray 2 (slight right tilt) -->
        <path class="heavy" d="M 410 202 L 426 130"/>
        <path d="M 418 168 L 414 174 M 418 168 L 424 172"/>

        <!-- Ray 3 (more right tilt) -->
        <path class="heavy" d="M 420 206 L 452 140"/>
        <path d="M 434 178 L 432 184 M 434 178 L 440 180"/>

        <!-- Ray 4 (far right, more horizontal) -->
        <path class="heavy" d="M 430 214 L 480 168"/>
        <path d="M 454 196 L 454 202 M 454 196 L 460 198"/>

        <!-- Ray 5 (slight left tilt) — mirror of Ray 2 -->
        <path class="heavy" d="M 390 202 L 374 130"/>
        <path d="M 382 168 L 386 174 M 382 168 L 376 172"/>

        <!-- Ray 6 (more left tilt) — mirror of Ray 3 -->
        <path class="heavy" d="M 380 206 L 348 140"/>
        <path d="M 366 178 L 368 184 M 366 178 L 360 180"/>

        <!-- Ray 7 (far left, more horizontal) — mirror of Ray 4 -->
        <path class="heavy" d="M 370 214 L 320 168"/>
        <path d="M 346 196 L 346 202 M 346 196 L 340 198"/>

      </g>

      <!-- ============================================ -->
      <!-- ANNOTATIONS -->
      <text class="callout" x="490" y="98">FLAME · GILDED · MCMLXXXVI</text>
      <line x1="486" y1="94" x2="572" y2="94" stroke="#7DD3FC" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.6"/>

      <text class="callout" x="240" y="172">CROWN · 7 RAYS · 7 SEAS</text>
      <line x1="320" y1="168" x2="340" y2="168" stroke="#7DD3FC" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.6"/>

      <text class="callout" x="180" y="448">TABULA · JULY · IV · MDCCLXXVI</text>
      <line x1="232" y1="444" x2="180" y2="444" stroke="#7DD3FC" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.6"/>

      <text class="callout" x="500" y="368">RIGHT ARM · 12.8 M</text>
      <line x1="498" y1="364" x2="490" y2="358" stroke="#7DD3FC" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.6"/>

      <text class="callout" x="540" y="760">CU SHEET · 2.4 MM</text>
      <line x1="535" y1="756" x2="495" y2="750" stroke="#7DD3FC" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.6"/>

      <text class="callout" x="540" y="892">FORT WOOD · 11-POINT STAR</text>
      <line x1="535" y1="888" x2="555" y2="888" stroke="#7DD3FC" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.6"/>

      <!-- Y-axis tick labels (heights in m) -->
      <text class="callout" x="78" y="124" fill="#7DD3FC" opacity="0.5">93M</text>
      <text class="callout" x="78" y="294" fill="#7DD3FC" opacity="0.5">76M</text>
      <text class="callout" x="78" y="544" fill="#7DD3FC" opacity="0.5">53M</text>
      <text class="callout" x="78" y="724" fill="#7DD3FC" opacity="0.5">47M</text>
      <text class="callout" x="78" y="914" fill="#7DD3FC" opacity="0.5">0M</text>

    </svg>
  </div>

  <div class="bot-strip">
    <span>SCALE 1:200 · METRIC</span>
    <span>FRONT ELEVATION · SHEET A</span>
    <span>BARTHOLDI · EIFFEL · MDCCCLXXXVI</span>
  </div>
</body></html>
